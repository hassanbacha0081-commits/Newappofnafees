# CI/CD Pipeline to automate building the Android Mobile Application (.apk)
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          npm install -g @capacitor/cli

      - name: Lint and Check Types
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Capacitor Doctor
        run: npx cap doctor

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Locate, Prepare & Verify APK
        id: verify_apk
        run: |
          echo "Searching for generated APK files in android/app/build/outputs/apk/..."
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No APK file generated in android/app/build/outputs/apk/"
            exit 1
          fi

          mkdir -p release-artifacts
          cp "$APK_FILE" release-artifacts/Nafees-Jewellers-ERP.apk

          APK_SIZE=$(du -h release-artifacts/Nafees-Jewellers-ERP.apk | cut -f1)

          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo ""
          echo "APK FILE:"
          echo "release-artifacts/Nafees-Jewellers-ERP.apk ($APK_SIZE)"
          echo ""
          echo "ARTIFACT:"
          echo "Nafees-Jewellers-ERP-APK"
          echo "=========================================="

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nafees-Jewellers-ERP-APK
          path: release-artifacts/Nafees-Jewellers-ERP.apk
          if-no-files-found: error
          retention-days: 30
